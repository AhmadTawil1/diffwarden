name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values so the settings load. The tests never call GitHub or Claude.
    env:
      GITHUB_APP_ID: "1"
      GITHUB_PRIVATE_KEY_BASE64: ZHVtbXk=
      GITHUB_WEBHOOK_SECRET: ci-dummy-secret
      ANTHROPIC_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
