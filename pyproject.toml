[project]
name = "diffwarden"
version = "0.1.0"
description = "AI pull request reviewer: a GitHub App built with FastAPI, LangGraph, and Claude."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
